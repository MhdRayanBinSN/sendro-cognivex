[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-product-research"
version = "0.1.0"
description = "Evidence-grounded product research and comparison API"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40,<1",
  "APScheduler>=3.10,<4",
  "Pillow>=10,<12",
  "fastapi>=0.115,<1",
  "google-genai>=1.30,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "lxml_html_clean>=0.4,<1",
  "markdown-it-py>=3,<5",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlmodel>=0.0.22,<1",
  "trafilatura>=1.12,<3",
  "tldextract>=5,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
