services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      SCREENSHOTS_DIR: /app/data/screenshots
    ports:
      - "8000:8000"
    volumes:
      - research_data:/app/data
    init: true
    ipc: host
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      SCREENSHOTS_DIR: /app/data/screenshots
    volumes:
      - research_data:/app/data
    init: true
    ipc: host
    restart: unless-stopped
volumes:
  research_data:
